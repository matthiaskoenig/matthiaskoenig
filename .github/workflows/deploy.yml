# Builds the Astro site in site/ and pushes the output to the
# matthiaskoenig.github.io repository, which GitHub Pages serves.
# Runs on every push to main (i.e. when develop is merged into main),
# every night to refresh the GitHub data, and manually.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # every night 04:00 UTC: refresh GitHub data
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one; a cancelled deployment leaves the
  # published site as it was, the newer run deploys
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      # main is the deployed branch; a scheduled run starts on the default
      # branch develop and would otherwise publish what is not merged into main
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Fetch runs first: if it fails the job stops here and the previous
      # deployment stays online, so the site never regresses to empty data.
      - run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: matthiaskoenig/matthiaskoenig.github.io
          publish_branch: main
          publish_dir: ./site/dist
          force_orphan: true
